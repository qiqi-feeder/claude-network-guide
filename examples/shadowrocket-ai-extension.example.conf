# Template only: import your own node separately.
# Replace every MY-US-VPS with its exact node name before use.
# Keep sr_top500_banlist_ad.conf installed; activate this extension.
# Device verification is required. See docs/shadowrocket.md.

[General]
include = sr_top500_banlist_ad.conf
always-ip-address = false
udp-policy-not-supported-behaviour = REJECT
ipv6 = false
dns-server = https://1.1.1.1/dns-query#proxy=MY-US-VPS, https://8.8.8.8/dns-query#proxy=MY-US-VPS
direct-dns-server = https://dns.alidns.com/dns-query, https://doh.pub/dns-query
fallback-dns-server = https://1.1.1.1/dns-query#proxy=MY-US-VPS, https://8.8.8.8/dns-query#proxy=MY-US-VPS

[Proxy Group]
AI-US = select, MY-US-VPS

[Rule]
DOMAIN-SUFFIX,anthropic.com,AI-US
DOMAIN-SUFFIX,claude.ai,AI-US
DOMAIN-SUFFIX,claude.com,AI-US
DOMAIN-SUFFIX,clau.de,AI-US
DOMAIN-SUFFIX,claudeusercontent.com,AI-US
DOMAIN-SUFFIX,claudemcpclient.com,AI-US
DOMAIN-SUFFIX,claudemcpcontent.com,AI-US
DOMAIN-SUFFIX,openai.com,AI-US
DOMAIN-SUFFIX,chatgpt.com,AI-US
DOMAIN-SUFFIX,oaistatic.com,AI-US
DOMAIN-SUFFIX,oaiusercontent.com,AI-US
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Shadowrocket/Claude/Claude.list,AI-US
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Shadowrocket/OpenAI/OpenAI.list,AI-US
